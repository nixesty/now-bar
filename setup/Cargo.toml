[package]
name = "pebbly-setup"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "pebbly-setup"
path = "src/main.rs"

[dependencies]
pebbly = { path = ".." }
slint = { version = "1.18", features = ["raw-window-handle-06", "software-renderer-systemfonts", "unstable-winit-030"] }
raw-window-handle = "0.6"
miniz_oxide = "0.8"
serde_json = "1"

# Only features the app's own windows already has: one build of windows (and of everything on
# top of it) serves both, whichever package cargo is asked for.
[dependencies.windows]
version = "0.62.2"
features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Registry",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_HiDpi",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
slint-build = "1.18"
miniz_oxide = "0.8"
